name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted runners are ephemeral. Cache the pinned Lean toolchain so
      # elan does not download and unpack it on every CI run.
      - name: Verify application-independent public interface
        run: python3 scripts/audit_public_library.py

      - name: Audit mathematical-module reachability
        run: python3 scripts/audit_module_reachability.py

      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      # Keep dependency checkouts and compiled project artifacts between runs.
      # Each commit gets a new cache, restored from the most recent compatible
      # predecessor when there is no exact hit.
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Build every local proof module, including optional library imports
        run: |
          mapfile -t modules < <(
            find Milliken -type f -name '*.lean' -print |
              sed -e 's@/@.@g' -e 's@\\.lean$@@' | sort
          )
          echo "Building ${#modules[@]} library modules beyond the umbrella target"
          lake build "${modules[@]}"

      - name: Compile independent public API examples
        run: lake env lean scripts/CheckPublicAPI.lean

      - name: Audit general-theorem imports and redundant dependencies
        run: python3 scripts/audit_dependency_graph.py

      - name: Audit all Lean source for local axioms and admissions
        run: python3 scripts/audit_source_integrity.py

      - name: Audit Milliken theorem axioms
        run: |
          mkdir -p proof-audit
          if ! lake env lean scripts/CheckMilliken.lean > proof-audit/milliken-axioms.log 2>&1; then
            echo 'Lean axiom audit failed; diagnostic log follows:'
            tail -n 220 proof-audit/milliken-axioms.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/milliken-axioms.log 519 || {
            cat proof-audit/milliken-axioms.log
            exit 1
          }

      - name: Retain theorem-axiom audit log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milliken-axiom-audit
          path: proof-audit/
          if-no-files-found: ignore
          retention-days: 7

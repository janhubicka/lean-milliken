name: Publish Milliken wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

concurrency:
  group: publish-milliken-wiki
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documented revision
        uses: actions/checkout@v4

      # GitHub stores Wiki pages in a separate .wiki.git repository.
      # The repository must be initialized once via Wiki > Create the first
      # page before GitHub will expose that repository to git clone/push.
      # See docs/wiki/Publishing.md.
      - name: Check whether the Wiki Git repository exists
        id: wiki
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          if git ls-remote "https://github.com/${GITHUB_REPOSITORY}.wiki.git" HEAD >/dev/null 2>&1; then
            echo "initialized=true" >> "$GITHUB_OUTPUT"
          else
            echo "initialized=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Wiki is not initialized. Create the first Home page at https://github.com/${GITHUB_REPOSITORY}/wiki and rerun this workflow."
          fi

      - name: Sync source documentation to the GitHub Wiki tab
        if: steps.wiki.outputs.initialized == 'true'
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: docs/wiki
          preprocess: true
          strategy: clone
          disable-empty-commits: true
